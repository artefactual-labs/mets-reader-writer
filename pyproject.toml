[build-system]
requires = [
  "setuptools>=77",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [""]
include = ["metsrw*"]
namespaces = false

[project]
name = "metsrw"
dynamic = [
  "version",
  "readme",
]
description = "Library for dealing with METS files."
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "lxml",
]
keywords = [
  "archivematica",
  "preservation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
authors = [
  {name = "Artefactual Systems Inc.", email = "info@artefactual.com"}
]
maintainers = [
  {name = "Artefactual Systems Inc.", email = "info@artefactual.com"}
]

[project.urls]
homepage = "https://github.com/artefactual-labs/mets-reader-writer/"
documentation = "https://mets-reader-writer.readthedocs.io/"
repository = "https://github.com/artefactual-labs/mets-reader-writer/"
issues = "https://github.com/archivematica/Issues/issues"

[dependency-groups]
docs = [
  "sphinx",
  "sphinx-rtd-theme",
]
dev = [
  {include-group = "docs"},
  "coverage[toml]",
  "pre-commit",
  "pytest",
  "pytest-cov",
]

[tool.uv]
# Keep compatibility with newer global uv installations used by deployments.
# GitHub Actions reads this value automatically via astral-sh/setup-uv.
required-version = ">=0.11.30"
# The version, readme and license are read from these files at build time, so
# rebuild the editable install when any of them changes.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "README.md" },
  { file = "LICENSE" },
  { file = "metsrw/__init__.py" },
]

[tool.setuptools.dynamic]
version = {attr = "metsrw.__version__"}
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.ruff.lint]
# Rule reference: https://docs.astral.sh/ruff/rules/
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "UP",
  "W",
]
ignore = [
  "B904",
  "E501",
  "UP031",
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.pytest.ini_options]
python_files = [
  "test_*.py",
]
testpaths = [
  "tests",
]

[tool.coverage.run]
source = [
  "metsrw",
]
branch = true
omit = [
  "tests/*",
]
