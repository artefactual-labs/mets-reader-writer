---
name: "Release"
on: "workflow_dispatch"
jobs:
  build:
    name: "Build"
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Set up uv and Python"
        uses: "astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e" # v10.3.2
        with:
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            uv.lock
          cache-suffix: "release"
      - name: "Build and check distribution packages"
        run: |
          make package-check
      - name: "Save distribution directory"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: "distribution"
          path: |
            dist
  upload:
    name: "Upload"
    needs: "build"
    runs-on: "ubuntu-24.04"
    environment: "release"
    permissions:
      id-token: "write"
    steps:
      - name: "Restore distribution directory"
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          name: "distribution"
          path: |
            dist
      - name: "Upload distribution packages to PyPI"
        uses: "pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086" # v1.14.3
