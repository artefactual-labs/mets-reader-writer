---
name: "Test"
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"
jobs:
  test:
    name: "Test Python ${{ matrix.python-version }}"
    runs-on: "ubuntu-24.04"
    strategy:
      fail-fast: false
      matrix:
        python-version: [
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14",
        ]
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Set up uv and Python ${{ matrix.python-version }}"
        uses: "astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884" # v10.3.0
        with:
          python-version: "${{ matrix.python-version }}"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            uv.lock
          cache-suffix: "test-${{ matrix.python-version }}"
      - name: "Run tests"
        env:
          UV_PYTHON: "${{ matrix.python-version }}"
        run: |
          make test PYTEST_ARGS="--cov metsrw --cov-report xml:coverage.xml"
      - name: "Upload coverage report"
        if: github.repository == 'artefactual-labs/mets-reader-writer'
        uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  lint:
    name: "Lint"
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Set up uv and Python"
        uses: "astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884" # v10.3.0
        with:
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            uv.lock
          cache-suffix: "lint"
      - name: "Run checks"
        run: |
          make check
  docs:
    name: "Docs"
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Set up uv and Python"
        uses: "astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884" # v10.3.0
        with:
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            uv.lock
          cache-suffix: "docs"
      - name: "Run the doctests and build the documentation"
        run: |
          make docs
